name: Validate schema and regenerate documentation

on:
  push:
    branches: [main]
    paths:
      - 'schema/system-description-0.5.0.json'
      - 'docs/generate-docs.json'

permissions:
  contents: write

jobs:
  validate-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate schema
        run: uv run --script validation/verify-schema.py

      - name: Regenerate docs
        run: make -C docs

      - name: Commit if changed
        run: |
          if git diff --quiet docs/index.html docs/schema_doc.css docs/schema_doc.min.js; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html docs/schema_doc.css docs/schema_doc.min.js
            git commit -m "Update schema docs [skip ci]"
            git push
          fi
